<VirtualHost *:443>
    ServerName ppcf-vm.biochem.mpg.de

    SSLEngine on
    # provision.sh installs a verified bundle whose first certificate is the
    # leaf certificate matching the key and expected hostname.
    SSLCertificateFile /etc/ssl/certs/ppsv-app-fullchain.pem
    SSLCertificateKeyFile /etc/ssl/private/ppsv-app.key

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Strip every client-controlled identity header at virtual-host scope.
    # `early` is valid here (but not inside Location) and runs before auth.
    RequestHeader unset X-Remote-User early
    RequestHeader unset X-Remote-Name early
    RequestHeader unset X-Remote-Email early
    RequestHeader unset X-Remote-Group early
    RequestHeader unset X-Remote-Phone early
    RequestHeader unset X-Forwarded-User early
    RequestHeader unset Remote-User early

    RewriteEngine On
    RewriteRule ^/$ /ppsv-app/ [R=302,L]

    # WebSocket traffic must be handled before the ordinary HTTP proxy rule.
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/ppsv-app/(.*)$ ws://127.0.0.1:3838/ppsv-app/$1 [P,L]

    ProxyPass /ppsv-app/ http://127.0.0.1:3838/ppsv-app/ retry=0 timeout=600
    ProxyPassReverse /ppsv-app/ http://127.0.0.1:3838/ppsv-app/

    <Location /ppsv-app/>
        AuthType Basic
        AuthName "PPSV request management"
        AuthBasicProvider ldap
        # uid is the login key. Additional attributes are exposed by
        # mod_authnz_ldap as server-side AUTHENTICATE_* variables only.
        AuthLDAPURL "ldaps://ldapserv1.biochem.mpg.de:636/dc=biochem,dc=mpg,dc=de?uid,displayName,mail,ou,telephoneNumber?sub?(objectClass=posixAccount)"
        AuthLDAPRemoteUserAttribute uid
        Require valid-user

        # Inject only values produced by this authenticated request. Empty LDAP
        # attributes remain empty; they can never fall back to a client header.
        RequestHeader set X-Remote-User "expr=%{REMOTE_USER}"
        RequestHeader set X-Remote-Name "expr=%{reqenv:AUTHENTICATE_DISPLAYNAME}"
        RequestHeader set X-Remote-Email "expr=%{reqenv:AUTHENTICATE_MAIL}"
        RequestHeader set X-Remote-Group "expr=%{reqenv:AUTHENTICATE_OU}"
        RequestHeader set X-Remote-Phone "expr=%{reqenv:AUTHENTICATE_TELEPHONENUMBER}"
    </Location>

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"

    LogLevel warn
    ErrorLog ${APACHE_LOG_DIR}/ppsv-app-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/ppsv-app-ssl-access.log combined
</VirtualHost>
