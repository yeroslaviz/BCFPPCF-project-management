<VirtualHost *:80>
    ServerName ppcf-vm.biochem.mpg.de

    # Never expose LDAP Basic authentication over plaintext HTTP.
    Redirect permanent / https://ppcf-vm.biochem.mpg.de/

    ErrorLog ${APACHE_LOG_DIR}/ppsvf-app-http-error.log
    CustomLog ${APACHE_LOG_DIR}/ppsvf-app-http-access.log combined
</VirtualHost>

